<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance Simulator</title>
    <meta name="description" content="Drag a mannequin into yoga poses and see how its centre of gravity must stay over the hands or feet on the floor to balance." />
    <meta name="theme-color" content="#f3f1ec" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage" aria-label="3D balance simulator view"></canvas>

      <header class="toolbar">
        <h1 class="toolbar__title">Balance Simulator</h1>
        <div class="toggles" role="group" aria-label="Options">
          <button type="button" class="toggle" id="mirror" aria-pressed="true" title="Move both arms together">
            <span class="toggle__box" aria-hidden="true"></span>Mirror<span class="toggle__extra"> arms</span>
          </button>
          <button type="button" class="toggle" id="split" aria-pressed="false" title="Move each leg on its own">
            <span class="toggle__box" aria-hidden="true"></span>Split<span class="toggle__extra"> legs</span>
          </button>
          <button type="button" class="toggle" id="mass" aria-pressed="false" title="Show where each body part's weight sits">
            <span class="toggle__box" aria-hidden="true"></span>Mass<span class="toggle__extra"> dots</span>
          </button>
        </div>
        <div class="view-switch" role="group" aria-label="Camera view">
          <button type="button" class="view-switch__btn" data-view="side" aria-pressed="true">Side</button>
          <button type="button" class="view-switch__btn" data-view="front" aria-pressed="false">Front</button>
          <button type="button" class="view-switch__btn" data-view="orbit" aria-pressed="false">Orbit</button>
        </div>
      </header>

      <div class="status" id="status" data-state="balanced">
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__label" role="status"></span>
        <span class="status__detail"></span>
      </div>

      <footer class="dock">
        <div class="presets" id="presets" role="group" aria-label="Pose presets"></div>
        <p class="hint">
          <span id="hint"></span>
          <span class="hint__credit">
            Mannequin by
            <a href="https://github.com/gdquest-demos/godot-3d-mannequin" target="_blank" rel="noopener">GDQuest and contributors</a>,
            <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
          </span>
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
